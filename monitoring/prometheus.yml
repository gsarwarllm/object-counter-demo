# Scrapes the app and TF Serving inside the Compose network
# (`docker compose --profile app --profile monitoring up`).
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: object-counter
    static_configs:
      - targets: ["app:5000"]
  - job_name: tfserving
    metrics_path: /monitoring/prometheus/metrics
    static_configs:
      - targets: ["tfserving:8501"]
